name: Build ZaquiGPS iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project ZaquiGPS.xcodeproj \
            -scheme ZaquiGPS \
            -configuration Release \
            -archivePath build/ZaquiGPS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/ZaquiGPS.xcarchive/Products/Applications/ZaquiGPS.app build/Payload/
          cd build
          zip -r ZaquiGPS.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZaquiGPS-Unsigned-IPA
          path: build/ZaquiGPS.ipa
          retention-days: 14
